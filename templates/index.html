{% extends "base.html" %}
{% block page_title %}{{ page_title }}{% endblock %}
{% block content %}
    <div class="centered">
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <form class="d-flex" method="GET" onSubmit='return validate();' action="/search">
            <input class="form-control me-2" name="search-query" type="search" placeholder="Search..." aria-label="Search"
                   autofocus="autofocus">

            <select name="ranking-method" class="custom-select" style="max-width: 200px;">
                <option value="tfidf" {% if ranking_method == 'tfidf' %}selected{% endif %}>TF-IDF + Cosine</option>
                <option value="bm25" {% if ranking_method == 'bm25' %}selected{% endif %}>BM25</option>
                <option value="custom" {% if ranking_method == 'custom' %}selected{% endif %}>Custom Score</option>
                <option value="word2vec" {% if ranking_method == 'word2vec' %}selected{% endif %}>Word2Vec + Cosine</option>
                <option value="doc2vec" {% if ranking_method == 'doc2vec' %}selected{% endif %}>Doc2Vec + Cosine</option>
            </select>

            <button class="btn btn-primary" type="submit" onclick='this.form.submit();'>Search</button>
            <input name="upf-irwa-hidden" type="hidden" value="123">
        </form>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
        <p>&nbsp;</p>
    </div>
{% endblock %}
